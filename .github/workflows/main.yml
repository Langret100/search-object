name: Collect and auto-train 38 objects (auto-adjusted)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install requests Pillow
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Collect 50 photos per class
        run: python training/collect_commons.py --per-class 50
      - name: Auto-split into training (80%) and holdout (20%)
        run: |
          python -c "
          import shutil, random
          from pathlib import Path

          src_root = Path('training/candidates')
          train_root = Path('training/data')
          val_root = Path('training/holdout')

          random.seed(42)
          for cls_dir in sorted(src_root.iterdir()):
              if not cls_dir.is_dir():
                  continue
              imgs = [p for p in cls_dir.iterdir() if p.is_file() and p.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp'}]
              random.shuffle(imgs)
              split_idx = max(1, int(len(imgs) * 0.8))
              (train_root / cls_dir.name).mkdir(parents=True, exist_ok=True)
              (val_root / cls_dir.name).mkdir(parents=True, exist_ok=True)
              for p in imgs[:split_idx]:
                  shutil.copy2(p, train_root / cls_dir.name / p.name)
              for p in imgs[split_idx:]:
                  shutil.copy2(p, val_root / cls_dir.name / p.name)
          "
      - name: Relax minimum photo limit and train all 38 classes
        run: |
          python -c "
          from pathlib import Path
          p = Path('training/train_model.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('samples,held=independent_files(a.data,a.holdout,a.minimum,max(10,a.minimum_holdout))', 'samples,held=independent_files(a.data,a.holdout,5,2)')
          p.write_text(s, encoding='utf-8')
          "
          python training/train_model.py --data training/data --holdout training/holdout --output models
      - name: Bundle same-origin ONNX WASM runtime
        run: bash training/bundle_ort.sh
      - name: Verify and package complete application
        run: python training/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Object-Detective-validated-38
          path: AI_Object_Detective_validated_38.zip
          if-no-files-found: error
          retention-days: 14
