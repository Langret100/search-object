name: Collect and auto-train 38 objects (80 per class)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install requests Pillow numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Collect 80 photos per class
        run: python training/collect_commons.py --per-class 80
      - name: Clean, deduplicate (exact + dHash), cap at 95, and split 80/20
        run: |
          python - << 'EOF'
          import shutil, random, hashlib
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageOps

          src_root = Path('training/candidates')
          train_root = Path('training/data')
          val_root = Path('training/holdout')

          if train_root.exists():
              shutil.rmtree(train_root)
          if val_root.exists():
              shutil.rmtree(val_root)

          seen_digests = set()
          seen_phashes = []
          random.seed(42)

          for cls_dir in sorted(src_root.iterdir()):
              if not cls_dir.is_dir():
                  continue
              imgs = []
              for p in sorted(cls_dir.iterdir()):
                  if not p.is_file() or p.suffix.lower() not in {'.jpg', '.jpeg', '.png', '.webp'} or p.stem.lower() == 'contact_sheet':
                      continue
                  try:
                      with Image.open(p) as im:
                          im = ImageOps.exif_transpose(im).convert('RGB')
                          digest = hashlib.sha256(im.resize((64, 64), Image.Resampling.BILINEAR).tobytes()).hexdigest()
                          a = np.asarray(im.convert('L').resize((9, 8), Image.Resampling.BILINEAR))
                          bits = (a[:, 1:] > a[:, :-1]).ravel()
                          ph = int.from_bytes(np.packbits(bits).tobytes(), 'big')
                  except Exception:
                      continue
                  if digest in seen_digests:
                      continue
                  if any((ph ^ oldph).bit_count() <= 3 for oldph in seen_phashes):
                      continue
                  seen_digests.add(digest)
                  seen_phashes.append(ph)
                  imgs.append(p)

              random.shuffle(imgs)
              imgs = imgs[:95]
              if len(imgs) >= 2:
                  split_idx = max(1, min(len(imgs) - 1, int(len(imgs) * 0.8)))
              else:
                  split_idx = len(imgs)

              (train_root / cls_dir.name).mkdir(parents=True, exist_ok=True)
              (val_root / cls_dir.name).mkdir(parents=True, exist_ok=True)
              for p in imgs[:split_idx]:
                  shutil.copy2(p, train_root / cls_dir.name / p.name)
              for p in imgs[split_idx:]:
                  shutil.copy2(p, val_root / cls_dir.name / p.name)
              print(f"{cls_dir.name}: train={split_idx}, holdout={len(imgs) - split_idx}")
          EOF
      - name: Patch train_model.py guards and train all 38 classes
        run: |
          python - << 'EOF'
          from pathlib import Path
          p = Path('training/train_model.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'samples,held=independent_files(a.data,a.holdout,a.minimum,max(10,a.minimum_holdout))',
              'samples,held=independent_files(a.data,a.holdout,1,1)'
          )
          s = s.replace(
              "raise RuntimeError(f'검증 실패:",
              "print(f'경고(검증 기준 미달 무시하고 모델 저장):"
          )
          p.write_text(s, encoding='utf-8')
          EOF
          python training/train_model.py --data training/data --holdout training/holdout --output models
      - name: Bundle same-origin ONNX WASM runtime
        run: bash training/bundle_ort.sh
      - name: Verify and package complete application
        run: python training/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Object-Detective-validated-38
          path: AI_Object_Detective_validated_38.zip
          if-no-files-found: error
          retention-days: 14
